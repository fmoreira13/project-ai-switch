openapi: 3.1.0
info:
  title: Matriz API
  version: 1.0.0
  description: >-
    REST contract for the Matriz application. Authentication uses an HTTP session
    cookie. Fetch /auth/csrf first and send the returned session-bound token in
    the X-CSRF-TOKEN header for state-changing requests, including login and logout.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://127.0.0.1:8080
    description: Local development environment
security:
  - sessionCookie: []
paths:
  /auth/csrf:
    get:
      summary: Obtain a CSRF token
      description: Returns a session-bound CSRF token needed in the X-CSRF-TOKEN header for state-changing requests.
      operationId: getCsrfToken
      security: []
      tags:
        - Authentication
      responses:
        '200':
          description: CSRF token initialized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/login:
    post:
      summary: Start a session
      description: Authenticates a user, rotates the session identifier, and sets the JSESSIONID cookie.
      operationId: login
      security: []
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session started.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: HttpOnly JSESSIONID session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/me:
    get:
      summary: Get the current profile
      description: Returns the identity associated with the active session.
      operationId: getCurrentProfile
      tags:
        - Authentication
      responses:
        '200':
          description: Current authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      summary: End the current session
      description: Invalidates the server-side session and clears its security context. Requires a CSRF token.
      operationId: logout
      tags:
        - Authentication
      responses:
        '204':
          description: Session ended.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /projects:
    get:
      summary: List projects
      description: Returns projects accessible to the authenticated user, optionally filtered by name.
      operationId: listProjects
      tags:
        - Projects
      parameters:
        - in: query
          name: q
          required: false
          schema:
            type: string
          description: Case-insensitive project-name search.
      responses:
        '200':
          description: Operation successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Create project
      description: Creates a new project.
      operationId: createProject
      tags:
        - Projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Remove project
      description: Removes a project with no tasks after user confirmation. Projects with tasks are retained and return 409.
      operationId: deleteProject
      tags:
        - Projects
      parameters:
        - in: query
          name: projectId
          required: true
          schema:
            type: string
            format: uuid
          description: Project identifier.
      responses:
        '204':
          description: Project removed successfully.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /projects/{projectId}:
    get:
      summary: Get project details
      description: Returns a project accessible to the authenticated user.
      operationId: getProject
      tags:
        - Projects
      parameters:
        - in: path
          name: projectId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Project details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update project
      description: Replaces a project's name and description. Only a project manager may update it.
      operationId: updateProject
      tags:
        - Projects
      parameters:
        - in: path
          name: projectId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: Project updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /tasks:
    get:
      summary: List or search tasks
      description: >-
        Returns unpaginated tasks accessible to the authenticated user. Optional status and
        priority filters affect items; counts always describe the full accessible task set
        before text, status, or priority filters are applied.
      operationId: listOrSearchTasks
      tags:
        - Tasks
      parameters:
        - in: query
          name: projectId
          required: false
          schema:
            type: string
            format: uuid
          description: Project identifier to filter tasks.
        - in: query
          name: q
          required: false
          schema:
            type: string
          description: Free-text search term.
        - in: query
          name: status
          required: false
          schema:
            $ref: '#/components/schemas/TaskStatus'
        - in: query
          name: priority
          required: false
          schema:
            $ref: '#/components/schemas/TaskPriority'
      responses:
        '200':
          description: Operation successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Create task
      description: Creates a new task associated with an existing project.
      operationId: createTask
      tags:
        - Tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Task created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      summary: Partially update a task
      description: Legacy compatibility endpoint. Use PUT /tasks/{taskId} for task edits.
      deprecated: true
      operationId: updateTask
      tags:
        - Tasks
      parameters:
        - in: query
          name: taskId
          required: true
          schema:
            type: string
            format: uuid
          description: Task identifier.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: Task updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /tasks/{taskId}:
    get:
      summary: Get task details
      description: Returns a task if the authenticated user is a member of its project.
      operationId: getTask
      tags:
        - Tasks
      parameters:
        - in: path
          name: taskId
          required: true
          schema:
            type: string
            format: uuid
          description: Task identifier.
      responses:
        '200':
          description: Task details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Replace task details
      description: Updates the task title, description, status, and priority. Project members may update tasks.
      operationId: replaceTask
      tags:
        - Tasks
      parameters:
        - in: path
          name: taskId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceTaskRequest'
      responses:
        '200':
          description: Task updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Remove task
      description: Removes a task and its dependent comments and assignment after user confirmation. Only project managers may remove tasks.
      operationId: deleteTask
      tags:
        - Tasks
      parameters:
        - in: path
          name: taskId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Task removed successfully.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{projectId}/members:
    get:
      summary: List eligible project members
      description: Returns active project members that a project manager may assign to tasks.
      operationId: listProjectMembers
      tags:
        - Projects
      parameters:
        - in: path
          name: projectId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Active project members.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMemberListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tasks/{taskId}/comments:
    get:
      summary: List task comments
      operationId: listTaskComments
      tags:
        - Tasks
      parameters:
        - in: path
          name: taskId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Task comments in creation order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Add a comment to a task
      operationId: addTaskComment
      tags:
        - Tasks
      parameters:
        - in: path
          name: taskId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '201':
          description: Comment created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tasks/{taskId}/assignees:
    post:
      summary: Add a task assignee
      description: Adds one active member of the project to a task. Only the project manager may add assignees, and a user cannot be assigned twice.
      operationId: addTaskAssignee
      tags:
        - Tasks
      parameters:
        - in: path
          name: taskId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignTaskRequest'
      responses:
        '201':
          description: Assignee added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /tasks/{taskId}/assignees/{assignmentId}:
    delete:
      summary: Remove one task assignee
      description: Removes only the specified assignment. Only the project manager may remove assignees.
      operationId: removeTaskAssignee
      tags:
        - Tasks
      parameters:
        - in: path
          name: taskId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: assignmentId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Assignee removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: HTTP session cookie issued by POST /auth/login.
  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          maxLength: 1000
    AuthenticatedUser:
      type: object
      required:
        - id
        - email
        - displayName
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
    CsrfToken:
      type: object
      required:
        - token
      properties:
        token:
          type: string
    Project:
      type: object
      required:
        - id
        - name
        - createdAt
        - role
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 3
          maxLength: 100
        description:
          type: [string, 'null']
          maxLength: 1000
        createdAt:
          type: string
          format: date-time
        role:
          type: string
          enum: [MANAGER, MEMBER]
    Task:
      type: object
      required:
        - id
        - projectId
        - title
        - status
        - priority
        - createdAt
        - assignees
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 3
          maxLength: 150
          description: Must contain 3-150 non-whitespace characters; surrounding whitespace is trimmed before storage.
        description:
          type: [string, 'null']
          maxLength: 2000
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: [string, 'null']
          format: date-time
        assignees:
          type: array
          items:
            $ref: '#/components/schemas/TaskAssignment'
    TaskAssignment:
      type: object
      required: [id, assignee, assignedAt]
      properties:
        id:
          type: string
          format: uuid
        assignee:
          $ref: '#/components/schemas/AuthenticatedUser'
        assignedAt:
          type: string
          format: date-time
    CreateProjectRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
        description:
          type: [string, 'null']
          maxLength: 1000
    UpdateProjectRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
        description:
          type: [string, 'null']
          maxLength: 1000
    CreateTaskRequest:
      type: object
      required:
        - projectId
        - title
      properties:
        projectId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 3
          maxLength: 150
          description: Must contain 3-150 non-whitespace characters; surrounding whitespace is trimmed before storage.
        description:
          type: [string, 'null']
          maxLength: 2000
        status:
          $ref: '#/components/schemas/TaskStatus'
          default: TODO
        priority:
          $ref: '#/components/schemas/TaskPriority'
          default: MEDIUM
    UpdateTaskRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 150
          description: Must contain 3-150 non-whitespace characters; surrounding whitespace is trimmed before storage.
        description:
          type: [string, 'null']
          maxLength: 2000
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/TaskPriority'
    ReplaceTaskRequest:
      type: object
      required: [title, status, priority]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 150
          description: Must contain 3-150 non-whitespace characters; surrounding whitespace is trimmed before storage.
        description:
          type: [string, 'null']
          maxLength: 2000
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/TaskPriority'
    TaskStatus:
      type: string
      enum: [TODO, IN_PROGRESS, DONE]
    TaskPriority:
      type: string
      enum: [LOW, MEDIUM, HIGH]
    Comment:
      type: object
      required: [id, taskId, authorId, authorName, body, createdAt]
      properties:
        id:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        authorName:
          type: string
        body:
          type: string
          minLength: 1
          maxLength: 2000
        createdAt:
          type: string
          format: date-time
    CreateCommentRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 2000
          description: Whitespace-only values are rejected; surrounding whitespace is trimmed before storage.
    AssignTaskRequest:
      type: object
      required: [assigneeId]
      properties:
        assigneeId:
          type: string
          format: uuid
    ProjectMember:
      type: object
      required: [id, email, displayName, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          type: string
          enum: [MANAGER, MEMBER]
    ProjectMemberListResponse:
      type: array
      items:
        $ref: '#/components/schemas/ProjectMember'
    ProjectListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Project'
    TaskListResponse:
      type: object
      required:
        - items
        - counts
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        counts:
          type: object
          required: [total, todo, inProgress, done]
          properties:
            total:
              type: integer
              minimum: 0
            todo:
              type: integer
              minimum: 0
            inProgress:
              type: integer
              minimum: 0
            done:
              type: integer
              minimum: 0
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: string
  responses:
    BadRequest:
      description: Request invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated user does not have access to this project or operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Data conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
