openapi: 3.1.0
info:
  title: Matriz API
  version: 1.0.0
  description: >-
    REST contract for the Matriz MVP, focused on project and task management.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: https://api.matriz.local/v1
    description: Local development environment
security: []
paths:
  /projects:
    get:
      summary: List projects
      description: Returns the list of projects in the MVP.
      operationId: listProjects
      tags:
        - Projects
      security: []
      responses:
        '200':
          description: Operation successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Create project
      description: Creates a new project.
      operationId: createProject
      tags:
        - Projects
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Remove project
      description: Removes an existing project after user confirmation.
      operationId: deleteProject
      tags:
        - Projects
      security: []
      parameters:
        - in: query
          name: projectId
          required: true
          schema:
            type: string
            format: uuid
          description: Project identifier.
      responses:
        '204':
          description: Project removed successfully.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /tasks:
    get:
      summary: List or search tasks
      description: Returns tasks for a project or results from free-text search.
      operationId: listOrSearchTasks
      tags:
        - Tasks
      security: []
      parameters:
        - in: query
          name: projectId
          required: false
          schema:
            type: string
            format: uuid
          description: Project identifier to filter tasks.
        - in: query
          name: q
          required: false
          schema:
            type: string
          description: Free-text search term.
      responses:
        '200':
          description: Operation successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Create task
      description: Creates a new task associated with an existing project.
      operationId: createTask
      tags:
        - Tasks
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Task created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      summary: Update task
      description: Updates basic fields or the task status.
      operationId: updateTask
      tags:
        - Tasks
      security: []
      parameters:
        - in: query
          name: taskId
          required: true
          schema:
            type: string
            format: uuid
          description: Task identifier.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: Task updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Remove task
      description: Removes a task after user confirmation.
      operationId: deleteTask
      tags:
        - Tasks
      security: []
      parameters:
        - in: query
          name: taskId
          required: true
          schema:
            type: string
            format: uuid
          description: Task identifier.
      responses:
        '204':
          description: Task removed successfully.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  schemas:
    Project:
      type: object
      required:
        - id
        - name
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
    Task:
      type: object
      required:
        - id
        - projectId
        - title
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, 'null']
        status:
          type: string
          enum: [backlog, in_progress, review, done, cancelled]
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: [string, 'null']
          format: date-time
    CreateProjectRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, 'null']
          maxLength: 1000
    CreateTaskRequest:
      type: object
      required:
        - projectId
        - title
      properties:
        projectId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, 'null']
          maxLength: 1000
        status:
          type: string
          enum: [backlog, in_progress, review, done, cancelled]
          default: backlog
    UpdateTaskRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, 'null']
          maxLength: 1000
        status:
          type: string
          enum: [backlog, in_progress, review, done, cancelled]
    ProjectListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Project'
    TaskListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Task'
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: string
  responses:
    BadRequest:
      description: Request invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Data conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
