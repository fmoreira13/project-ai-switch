name: Matriz CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Java tests
        run: ./gradlew --no-daemon clean test

      - name: Check frontend JavaScript
        run: |
          node --check src/main/resources/static/js/auth.js
          node --check src/main/resources/static/js/login.js
          node --check src/main/resources/static/js/index.js
          node --experimental-default-type=module --test src/test/js/auth.test.mjs

      - name: Run browser end-to-end test
        run: npm run test:e2e

      - name: Validate Docker Compose configuration
        run: docker compose --env-file .env.example config --quiet

  build-image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build container image
        run: docker build --tag matriz:ci .

      - name: Scan container image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: matriz:ci
          format: table
          vuln-type: os
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: "false"
          timeout: 10m

  publish-image:
    if: github.event_name == 'release' && github.event.release.prerelease == true
    needs: [verify, build-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.actor }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$GH_USER" --password-stdin

      - name: Build and publish release candidate image
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          VERSION: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          VERSION="${VERSION#v}"
          docker build \
            --tag "$IMAGE_NAME:$VERSION" \
            --tag "$IMAGE_NAME:sha-$COMMIT_SHA" \
            .
          docker push "$IMAGE_NAME:$VERSION"
          docker push "$IMAGE_NAME:sha-$COMMIT_SHA"
