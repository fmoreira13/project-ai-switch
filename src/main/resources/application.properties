spring.application.name=matriz
spring.datasource.url=${MATRIZ_DB_URL:jdbc:h2:file:./data/matriz;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${MATRIZ_DB_USERNAME:sa}
spring.datasource.password=${MATRIZ_DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
matriz.demo.manager-password=${MATRIZ_DEMO_MANAGER_PASSWORD:manager-demo-change-me}
matriz.demo.member-password=${MATRIZ_DEMO_MEMBER_PASSWORD:member-demo-change-me}
